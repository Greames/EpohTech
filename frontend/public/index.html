<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0B0C0E" />
        <meta name="description" content="Anvaya Partners Private Limited is an early-stage investment firm that invests its own capital in startups and works hands-on with founders on strategy, technology, finance, operations and go-to-market. Where capital meets founders." />
        <meta name="keywords" content="early-stage investment firm India, startup investors India, founder capital India, operator-led investors, hands-on startup investment, Anvaya Partners" />
        <meta property="og:title" content="Anvaya Partners — Where Capital Meets Founders" />
        <meta property="og:description" content="We invest our own capital in early-stage startups and work hands-on with their founders on strategy, technology, finance, operations and go-to-market." />
        <meta property="og:type" content="website" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>Anvaya Partners — Where Capital Meets Founders</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!-- Registers the EPOHTECH enquiry form with Netlify Forms at deploy time.
             Field names must match the form in src/pages/EpohContactPage.js. -->
        <form name="epoh-enquiry" action="/enquiry-received.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
            <input type="text" name="name" />
            <input type="text" name="phone" />
            <input type="email" name="email" />
            <input type="text" name="interest" />
            <textarea name="message"></textarea>
            <input type="text" name="consent" />
            <input type="text" name="bot-field" />
        </form>

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
