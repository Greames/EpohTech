# Build the React frontend from /frontend and serve it as a single-page app.
[build]
  base = "frontend"
  command = "yarn build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
  # CRA treats lint warnings as errors when CI is set.
  CI = "false"
  GENERATE_SOURCEMAP = "false"

# theepoh.com opens on the EPOHTECH home page; other domains keep Anvaya at /.
[[redirects]]
  from = "https://theepoh.com/"
  to = "https://theepoh.com/epohtech"
  status = 302
  force = true

[[redirects]]
  from = "https://www.theepoh.com/"
  to = "https://theepoh.com/epohtech"
  status = 302
  force = true

# Old theepoh.com pages (previous site) -> their EPOHTECH equivalents, so existing
# links and search results keep working. Paths are the usual slugs for the old
# site's menu (About Us, Our Services, Our Solutions, Contact Us, Careers).
[[redirects]]
